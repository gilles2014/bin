<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartelas Binárias</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px;text-align:center}
#controls{margin-bottom:20px}
#cartelas{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.card{width:120px;height:180px;background:#fff;border:2px solid #333;border-radius:10px;
display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;
transition:opacity .4s,transform .4s}
.hide{opacity:0;transform:translateY(20px);pointer-events:none;width:0;margin:0;border:none;overflow:hidden}
button{padding:8px 16px}
</style>
</head>
<body>
<h2>Cartelas Binárias</h2>
<div id="controls">
<label>Quantidade:
<select id="qtd">
<option>1</option><option>2</option><option>3</option><option selected>5</option><option>4</option>
</select></label>
<button onclick="sortear()">Sortear</button>
</div>
<div id="cartelas">
<div class="card">1</div>
<div class="card">2</div>
<div class="card">4</div>
<div class="card">8</div>
<div class="card">16</div>
</div>
<script>
const cards=[...document.querySelectorAll('.card')];
const sel=document.getElementById('qtd');
function atualizar(){
 const n=parseInt(sel.value);
 cards.forEach((c,i)=>c.classList.toggle('hide',i>=n));
}
sel.onchange=atualizar;
function sortear(){
 const n=parseInt(sel.value);
 const v=Math.floor(Math.random()*(1<<n));
 cards.forEach((c,i)=>{
   if(i<n){
     c.style.background=((v>>i)&1)?'#9f9':'#fff';
   }
 });
}
atualizar();
</script>
</body>
</html>
