<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cartelas Binárias</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>

    body{
      font-family:'Poppins', sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      min-height:100vh;
      color:white;
      overflow-x:hidden;
    }

    .title{
      text-align:center;
      margin-top:25px;
      font-size:3rem;
      font-weight:700;
    }

    .subtitle{
      text-align:center;
      color:#cbd5e1;
      margin-bottom:25px;
      font-size:1.1rem;
    }

    /* ÁREA DAS CARTELAS */
    .cards-container{
      display:flex;
      justify-content:center;
      align-items:flex-end;
      gap:18px;
      flex-wrap:nowrap;
      padding:10px 15px;
      width:100%;
    }

    /* CARTÃO */
    .binary-card{
      width:170px;
      height:340px;
      perspective:1000px;
      cursor:pointer;
      flex-shrink:1;
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .binary-card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-face{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:25px;
      backface-visibility:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      border:5px solid #facc15;
      box-shadow:
        0 10px 30px rgba(0,0,0,0.4),
        inset 0 0 10px rgba(255,255,255,0.1);
    }

    /* Frente */
    .front{
      background:#e5e7eb;
    }

    /* Costas */
    .back{
      background:#1e293b;
      transform:rotateY(180deg);
      border:5px solid #475569;
    }

    /* ÁREA DOS PONTOS */
    .dots{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      justify-items:center;
      align-content:center;
      gap:12px;
      padding:20px;
      overflow:hidden;
    }

    /* PONTOS */
    .dot{
      width:24px;
      height:24px;
      border-radius:50%;
      background:#facc15;
      border:2px solid #475569;
      box-shadow:0 0 8px rgba(250,204,21,0.7);
    }

    /* PAINEL RESULTADO */
    .info-panel{
      width:420px;
      margin:30px auto 15px auto;
      background:rgba(255,255,255,0.08);
      border-radius:18px;
      padding:18px 25px;
      text-align:center;
      backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,0.08);

      display:flex;
      justify-content:space-around;
      align-items:center;
    }

    .result-block{
      flex:1;
    }

    .divider{
      width:1px;
      height:70px;
      background:rgba(255,255,255,0.2);
    }

    .label{
      font-size:1rem;
      color:#cbd5e1;
      margin-bottom:5px;
    }

    .value{
      font-size:2.3rem;
      font-weight:700;
    }

    .decimal{
      color:#38bdf8;
    }

    .binary{
      color:#facc15;
      letter-spacing:4px;
    }

    .btn-reset{
      margin-top:10px;
      border-radius:50px;
      padding:10px 28px;
      font-weight:600;
      font-size:1rem;
    }

    /* RESPONSIVO */
    @media(max-width:1200px){

      .binary-card{
        width:145px;
        height:300px;
      }

    }

    @media(max-width:992px){

      .cards-container{
        flex-wrap:wrap;
      }

      .binary-card{
        width:150px;
        height:300px;
      }

    }

    @media(max-width:768px){

      .title{
        font-size:2rem;
      }

      .binary-card{
        width:120px;
        height:250px;
      }

      .dot{
        width:18px;
        height:18px;
      }

      .info-panel{
        width:95%;
      }

      .value{
        font-size:1.8rem;
      }

    }

  </style>
</head>

<body>

  <div class="container-fluid">

    <h1 class="title">Cartelas Binárias Interativas</h1>

    <p class="subtitle">
      Clique nas cartelas para virar e descobrir os números binários
    </p>

    <div class="text-center mb-4">
      <label for="qtdCartelas" class="me-2">Quantidade de cartelas:</label>
    
      <select id="qtdCartelas" class="form-select d-inline-block w-auto">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
      </select>
    </div>
    
    <div class="cards-container" id="cardsContainer"></div>

    <!-- RESULTADOS -->
    <div class="info-panel">

      <div class="result-block">
        <div class="label">Decimal</div>
        <div class="value decimal" id="decimalValue">31</div>
      </div>

      <div class="divider"></div>

      <div class="result-block">
        <div class="label">Binário</div>
        <div class="value binary" id="binaryValue">11111</div>
      </div>

    </div>

    <div class="text-center">
      <button class="btn btn-warning btn-reset" onclick="resetCards()">
        Resetar
      </button>
    </div>

  </div>

  <script>

    const values = [16, 8, 4, 2, 1];
    
    const container = document.getElementById('cardsContainer');
    const selectQtd = document.getElementById('qtdCartelas');
    
    function criarCartelas(qtd) {
    
      container.innerHTML = "";
    
      const valoresSelecionados = values.slice(values.length - qtd);
    
      valoresSelecionados.forEach(value => {
    
        const card = document.createElement('div');
        card.className = 'binary-card';
        card.dataset.value = value;
        card.dataset.active = "1";
    
        let dotsHTML = "";
    
        for (let i = 0; i < value; i++) {
          dotsHTML += `<div class="dot"></div>`;
        }
    
        card.innerHTML = `
          <div class="card-inner">
    
            <div class="card-face front">
              <div class="dots">
                ${dotsHTML}
              </div>
            </div>
    
            <div class="card-face back"></div>
    
          </div>
        `;
    
        card.addEventListener('click', () => {
    
          card.classList.toggle('flipped');
    
          card.dataset.active =
            card.dataset.active === "1" ? "0" : "1";
    
          updateResult();
    
        });
    
        container.appendChild(card);
    
      });
    
      updateResult();
    }
    
    function updateResult() {
    
      const cards = document.querySelectorAll('.binary-card');
    
      let decimal = 0;
      let binary = "";
    
      cards.forEach(card => {
    
        if (card.dataset.active === "1") {
          decimal += Number(card.dataset.value);
          binary += "1";
        } else {
          binary += "0";
        }
    
      });
    
      document.getElementById("decimalValue").innerText = decimal;
      document.getElementById("binaryValue").innerText = binary;
    
    }
    
    function resetCards() {
    
      const cards = document.querySelectorAll('.binary-card');
    
      cards.forEach(card => {
    
        card.classList.remove("flipped");
        card.dataset.active = "1";
    
      });
    
      updateResult();
    
    }
    
    selectQtd.addEventListener("change", () => {
      criarCartelas(Number(selectQtd.value));
    });
    
    // Inicia com 5 cartelas
    criarCartelas(5);
  </script>

</body>
</html>
